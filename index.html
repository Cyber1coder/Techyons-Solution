<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Salary Form</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f1f3f6;
      padding:40px 20px;
      display:flex;
      justify-content:center;
    }

    .form-container{
      width:100%;
      max-width:800px;
      background:#fff;
      padding:40px;
      border-radius:14px;
      box-shadow:0 4px 20px rgba(0,0,0,0.08);
    }

    h2{
      font-size:26px;
      margin-bottom:25px;
      color:#111827;
    }

    .section{
      margin-bottom:45px;
    }

    .input-box{
      margin-bottom:20px;
    }

    .input-box label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
      font-weight:600;
      color:#374151;
    }

    .input-box input,
    .input-box select{
      width:100%;
      height:55px;
      border:1px solid #d1d5db;
      border-radius:10px;
      padding:0 16px;
      font-size:15px;
      outline:none;
      transition:0.3s;
      background:#fff;
    }

    .input-box input:focus,
    .input-box select:focus{
      border-color:#2563eb;
      box-shadow:0 0 0 3px rgba(37,99,235,0.15);
    }

    .row{
      display:flex;
      gap:20px;
    }

    .row .input-box{
      flex:1;
    }

    .radio-wrapper{
      display:flex;
      gap:25px;
      margin-top:10px;
      margin-bottom:20px;
    }

    .radio-item{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .radio-item input{
      width:18px;
      height:18px;
    }

    .submit-btn{
      width:100%;
      height:58px;
      border:none;
      border-radius:12px;
      background:#0d6efd;
      color:#fff;
      font-size:17px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    .submit-btn:hover{
      background:#0b5ed7;
    }

    .success{
      margin-top:20px;
      padding:14px;
      border-radius:10px;
      background:#d1fae5;
      color:#065f46;
      display:none;
    }

    @media(max-width:700px){

      .row{
        flex-direction:column;
        gap:0;
      }

      .form-container{
        padding:25px;
      }
    }
  </style>
</head>

<body>

  <div class="form-container">

    <!-- SECTION 1: Company & Title Information -->
    <div class="section">
      <h2>Company & Title Information</h2>

      <div class="input-box">
        <label>Company</label>
        <input type="text" id="company" placeholder="Enter company">
      </div>

      <div class="input-box">
        <label>Title</label>
        <input type="text" id="title" placeholder="Enter title">
      </div>

      <div class="row">
        <div class="input-box">
          <label>Job Family</label>
          <select id="jobFamily">
            <option value="">Select Job Family</option>
            <option value="Software Engineer">Software Engineer</option>
            <option value="Data Scientist">Data Scientist</option>
            <option value="Machine Learning Engineer">Machine Learning Engineer</option>
            <option value="DevOps Engineer">DevOps Engineer</option>
            <option value="Product Manager">Product Manager</option>
            <option value="Product Designer">Product Designer</option>
          </select>
        </div>

        <div class="input-box">
          <label>Level</label>
          <input type="text" id="level" placeholder="e.g. IC3, IC4, Senior, Director">
        </div>
      </div>

      <div class="row">
        <div class="input-box">
          <label>Specialization (Focus Tag)</label>
          <input type="text" id="focusTag" placeholder="e.g. Frontend, Backend, Machine Learning">
        </div>

        <div class="input-box">
          <label>Education</label>
          <select id="education">
            <option value="Bachelor's">Bachelor's Degree</option>
            <option value="Master's">Master's Degree</option>
            <option value="PhD">PhD</option>
            <option value="High School">High School</option>
          </select>
        </div>
      </div>
    </div>

    <!-- SECTION 2: Work Experience & Location -->
    <div class="section">
      <h2>Work Experience & Location</h2>

      <label style="font-weight:600;">
        Compensation details are from:
      </label>

      <div class="radio-wrapper">
        <div class="radio-item">
          <input type="radio" name="compPerspective" value="offer" checked>
          <span>New Offer</span>
        </div>
        <div class="radio-item">
          <input type="radio" name="compPerspective" value="current">
          <span>Employee</span>
        </div>
      </div>

      <div class="row">
        <div class="input-box">
          <label>Month Received</label>
          <select id="offerMonth">
            <option value="Jan">January</option>
            <option value="Feb">February</option>
            <option value="Mar">March</option>
            <option value="Apr">April</option>
            <option value="May" selected>May</option>
            <option value="Jun">June</option>
            <option value="Jul">July</option>
            <option value="Aug">August</option>
            <option value="Sep">September</option>
            <option value="Oct">October</option>
            <option value="Nov">November</option>
            <option value="Dec">December</option>
          </select>
        </div>

        <div class="input-box">
          <label>Year</label>
          <select id="offerYear">
            <option value="2023">2023</option>
            <option value="2024">2024</option>
            <option value="2025" selected>2025</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="input-box">
          <label>Years of Experience</label>
          <input type="number" id="yearsOfExperience" placeholder="2" min="0">
        </div>

        <div class="input-box">
          <label>Years at Company</label>
          <input type="number" id="yearsAtCompany" placeholder="0" min="0">
        </div>

        <div class="input-box">
          <label>Years at Level</label>
          <input type="number" id="yearsAtLevel" placeholder="0" min="0">
        </div>
      </div>

      <div class="row">
        <div class="input-box">
          <label>Location</label>
          <input type="text" id="location" placeholder="City, Country">
        </div>

        <div class="input-box">
          <label>Arrangement</label>
          <select id="workArrangement">
            <option value="onsite">Onsite</option>
            <option value="remote">Remote</option>
            <option value="hybrid">Hybrid</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="input-box">
          <label>Employment Type</label>
          <select id="employmentType">
            <option value="full-time">Full-time</option>
            <option value="contract">Contract</option>
            <option value="part-time">Part-time</option>
            <option value="intern">Intern</option>
          </select>
        </div>

        <div class="input-box">
          <label>Gender (Optional)</label>
          <select id="gender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Non-binary">Non-binary</option>
            <option value="Prefer not to say">Prefer not to say</option>
          </select>
        </div>
      </div>
    </div>

    <!-- SECTION 3: Compensation Details -->
    <div class="section">
      <h2>Compensation Details</h2>

      <div class="row">
        <div class="input-box" style="flex: 2;">
          <label>Base Salary</label>
          <input type="number" id="baseSalary" placeholder="Enter base salary" min="0">
        </div>

        <div class="input-box" style="flex: 1;">
          <label>Currency</label>
          <select id="baseSalaryCurrency">
            <option value="USD" selected>USD</option>
            <option value="INR">INR</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="CAD">CAD</option>
            <option value="AUD">AUD</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="input-box">
          <label>Avg Annual Stock Grant Value (USD)</label>
          <input type="number" id="avgAnnualStockGrantValue" placeholder="0" min="0">
        </div>

        <div class="input-box">
          <label>Avg Annual Bonus Value</label>
          <input type="number" id="avgAnnualBonusValue" placeholder="0" min="0">
        </div>

        <div class="input-box">
          <label>Target Bonus %</label>
          <input type="number" id="annualTargetBonusPercentage" placeholder="0" min="0" max="100">
        </div>
      </div>

      <div class="input-box">
        <label>Total Compensation (Auto-calculated Local Currency)</label>
        <input type="text" id="totalCompensation" readonly placeholder="Calculated automatically" style="background: #f9fafb; font-weight: bold; color: #2563eb;">
      </div>
    </div>

    <!-- SECTION 4: Validation Results Block -->
    <div id="resultsContainer" style="display: none; margin-top: 30px; margin-bottom: 30px; padding: 25px; border-radius: 12px; border: 1px solid #d1d5db; background: #f9fafb; transition: 0.3s;">
      <h3 style="font-size: 20px; margin-bottom: 15px; color: #111827; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px;">Validation Results</h3>
      
      <!-- Verdict Badge -->
      <div id="verdictBadge" style="display: inline-block; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 16px; margin-bottom: 20px; text-transform: uppercase; color: #fff;">
        Approved
      </div>
      
      <!-- Consistency Scores -->
      <div style="margin-bottom: 10px;">
        <span style="font-weight: bold; color: #374151;">Consistency Score:</span>
        <span id="resConsistencyScore" style="font-size: 16px; font-weight: bold; color: #2563eb; margin-left: 5px;">-</span>
      </div>
      
      <div style="margin-bottom: 20px;">
        <span style="font-weight: bold; color: #374151;">User Trust Score:</span>
        <span id="resTrustScore" style="font-size: 16px; font-weight: bold; color: #10b981; margin-left: 5px;">-</span>
      </div>
      
      <!-- Anomaly Flags -->
      <div id="reasonsBlock" style="display: none; margin-bottom: 20px; padding: 15px; border-radius: 8px; background: #fdf2f2; border: 1px solid #fde8e8;">
        <h4 style="font-size: 14px; font-weight: bold; color: #9b1c1c; margin-bottom: 8px;">Triggered Flags:</h4>
        <ul id="reasonsList" style="list-style-type: disc; margin-left: 20px; color: #b91c1c; font-size: 14px; line-height: 1.5;">
          <!-- dynamic flags will be injected here -->
        </ul>
      </div>

      <!-- Segment Peer Details -->
      <div id="segmentStatsBlock" style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed #d1d5db; font-size: 14px; color: #4b5563;">
        <div><strong>Segment:</strong> <span id="resSegmentName">-</span></div>
        <div style="margin-top: 5px;"><strong>Peer Count:</strong> <span id="resSegmentSize">-</span></div>
        <div style="margin-top: 5px;"><strong>Average Segment Salary:</strong> <span id="resSegmentAvg">-</span></div>
      </div>
    </div>

    <button class="submit-btn" id="submitBtn">
      Submit & Validate Salary
    </button>

    <div class="success" id="successMsg">
      Salary submitted and validated!
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
